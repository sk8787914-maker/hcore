name: Build RENN APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: renn-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # AGP 8.2.1 needs JDK 17. Gradle 8.5 is installed via setup-gradle
      # because the wrapper URL in this repo points to a local AndroidIDE path.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;24.0.8215888"

      # The release signing config expects app/jeet.jks (gitignored).
      # Generate an equivalent CI keystore at runtime — no repo file is changed.
      # The hCore SDK itself is initialized without any key in this project.
      - name: Generate CI signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/jeet.jks -storetype JKS \
            -alias key0 -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass 11111111 -keypass 11111111 \
            -dname "CN=RENN CI Build, OU=CI, O=CI, L=NA, ST=NA, C=US"

      - name: Build release APK
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p artifacts
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No release APK was produced" >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            cp "$apk" artifacts/RENN-release.apk
          done
          ls -lh artifacts

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RENN-APK-${{ github.run_number }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish APK on GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_id }}
          name: RENN APK - Build ${{ github.run_number }}
          files: artifacts/*.apk
          generate_release_notes: true
